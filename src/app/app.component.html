<div class="min-h-screen bg-surface-light flex flex-col font-sans">
  
  @if (authService.isAuthenticated()) {
    <header class="sticky top-0 z-50 w-full bg-brand-950 shadow-lg">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <div class="flex items-center gap-8">
            <span class="font-bold text-2xl tracking-tight text-white flex items-center gap-2">
              <mat-icon class="text-brand-400">account_balance</mat-icon>
              Fya Créditos
            </span>
            
            <nav class="hidden md:flex gap-2">
              <a routerLink="/registro" routerLinkActive="bg-white/10 text-white font-semibold" class="px-4 py-2 rounded-xl text-sm font-medium text-brand-100 hover:bg-white/5 transition-colors flex items-center gap-2">
                <mat-icon class="scale-90">add_circle</mat-icon>
                Registrar Crédito
              </a>
              <a routerLink="/consulta" routerLinkActive="bg-white/10 text-white font-semibold" class="px-4 py-2 rounded-xl text-sm font-medium text-brand-100 hover:bg-white/5 transition-colors flex items-center gap-2">
                <mat-icon class="scale-90">list_alt</mat-icon>
                Consultar
              </a>
            </nav>
          </div>

          <button mat-icon-button (click)="logout()" title="Cerrar sesión" class="text-brand-100 hover:text-white hover:bg-white/10 transition-colors rounded-full">
            <mat-icon>logout</mat-icon>
          </button>
        </div>
      </div>
    </header>
  }

  <main class="flex-grow overflow-auto p-4 md:p-8">
    <router-outlet></router-outlet>
  </main>
</div>
