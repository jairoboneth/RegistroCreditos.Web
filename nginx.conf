server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión Gzip para mejorar el rendimiento
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Configuración clave para Angular (Single Page Application)
        # Si no encuentra el archivo, devuelve index.html para que Angular maneje la ruta
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de archivos estáticos para optimizar carga
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
