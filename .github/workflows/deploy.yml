name: CI/CD Pipeline - Docker & Vercel

on:
  push:
    branches:
      - master # O main, dependiendo de la rama principal
  pull_request:
    branches:
      - master

jobs:
  # 1. Job para verificar que el Dockerfile compila correctamente
  # Esto garantiza que la imagen Docker esté lista para despliegues on-premise si es necesario
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Cambiar a true y añadir secrets de DockerHub/GHCR si deseas publicarla
          tags: registro-creditos-web:latest

  # 2. Job para desplegar el frontend en Vercel
  vercel-deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master' # Solo despliega en push a master
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Instalar pnpm (requerido por este proyecto)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular Project
        env:
          API_URL: ${{ secrets.API_URL }}
        run: pnpm build --configuration production

      # Despliegue usando Vercel CLI Action
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod' # Despliegue de producción
